name: art

# Make pictures for posts that already exist. Run by hand.
#
# pilot (the default): the pictures and the changed posts go to the branch
# "art-pilot" and nowhere else. Nothing on the live site changes. Look at
# them there; if they are good, run again with pilot off.
#
# pilot off: the same, committed to main, and the site is rebuilt.
#
# Needs the secret OPENAI_API_KEY. Spending is capped by the budget below
# and recorded in agent/art-ledger.json.
on:
  workflow_dispatch:
    inputs:
      posts:
        description: "Post files, space separated (src/posts/....md)"
        required: true
      pilot:
        description: "Pilot: commit to the art-pilot branch only"
        type: boolean
        default: true
      budget:
        description: "Most to spend in this run's day, in dollars (estimated at $0.25 a picture)"
        default: "3.00"
      model:
        description: "Image model name. Empty: try the list in scripts/art.py"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: art
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic pillow
      - name: Make the pictures
        env:
          WE_ART: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WE_ART_DAILY_USD: ${{ inputs.budget }}
          WE_ART_MODEL: ${{ inputs.model }}
          POSTS: ${{ inputs.posts }}
        run: |
          for p in $POSTS; do python scripts/art.py --force --post "$p"; done
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "WE"
          git config user.email "signedwe@users.noreply.github.com"
          git add src/posts agent/art.json agent/art-ledger.json
          if [ -d src/static/art ]; then git add src/static/art; fi
          if git diff --cached --quiet; then echo "Nothing was made."; exit 0; fi
          if [ "${{ inputs.pilot }}" = "true" ]; then
            git checkout -B art-pilot
            git commit -m "art pilot: $(date -u +%Y-%m-%d)"
            git push -f origin art-pilot
          else
            git commit -m "art: $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
            gh workflow run rebuild.yml
          fi
