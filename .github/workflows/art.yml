name: art

# Make pictures for posts that already exist. Run by hand.
#
# pilot (the default): the pictures are drawn and saved to pilot/art/, which
# the site does not build. No post changes and nothing on the site changes.
# Look at them there. To hang the ones you like, run again with "promote".
#
# promote: hang pilot pictures on their posts. Draws nothing, costs nothing.
# Leave "posts" empty for all of them, or give the slugs to hang.
#
# pilot off, promote off: draw and hang in one go.
#
# Needs the secret OPENAI_API_KEY. Spending is capped by the budget below
# and recorded in agent/art-ledger.json.
on:
  workflow_dispatch:
    inputs:
      posts:
        description: "Post files, space separated (src/posts/....md). For promote: slugs, or empty for all"
        required: false
        default: ""
      pilot:
        description: "Pilot: draw, but hang nothing"
        type: boolean
        default: true
      promote:
        description: "Promote: hang pilot pictures already drawn"
        type: boolean
        default: false
      commissions:
        description: "Commissions: draw the pictures listed in pilot/commissions.json (always a pilot)"
        type: boolean
        default: false
      max_images:
        description: "Most pictures to draw today, counting those already drawn"
        default: "8"
      budget:
        description: "Most to spend in this run's day, in dollars (estimated at $0.25 a picture)"
        default: "3.00"
      model:
        description: "Image model name. Empty: try the list in scripts/art.py"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: art
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic pillow
      - name: Make or hang the pictures
        env:
          WE_ART: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WE_ART_DAILY_USD: ${{ inputs.budget }}
          WE_ART_MODEL: ${{ inputs.model }}
          WE_ART_DAILY_IMAGES: ${{ inputs.max_images }}
          POSTS: ${{ inputs.posts }}
        run: |
          if [ "${{ inputs.commissions }}" = "true" ]; then
            python scripts/art.py --commissions
          elif [ "${{ inputs.promote }}" = "true" ]; then
            python scripts/art.py --promote $POSTS
          elif [ "${{ inputs.pilot }}" = "true" ]; then
            for p in $POSTS; do python scripts/art.py --force --pilot --post "$p"; done
          else
            for p in $POSTS; do python scripts/art.py --force --post "$p"; done
          fi
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "WE"
          git config user.email "signedwe@users.noreply.github.com"
          git add -A src/posts agent/art.json agent/art-ledger.json
          if [ -d src/static/art ]; then git add -A src/static/art; fi
          if [ -d pilot ]; then git add -A pilot; fi
          if git diff --cached --quiet; then echo "Nothing was made."; exit 0; fi
          git commit -m "art: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
          if [ "${{ inputs.commissions }}" = "true" ]; then exit 0; fi
          if [ "${{ inputs.pilot }}" != "true" ] || [ "${{ inputs.promote }}" = "true" ]; then
            gh workflow run rebuild.yml
          fi
