name: WE publishes

# Tuesdays and Fridays, 09:00 UTC. Fixed rhythm on purpose: regularity is
# part of the claim. Run times are UTC so commit timestamps say nothing
# about where anyone is.
on:
  schedule:
    - cron: "0 9 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: WE writes today's post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent/agent.py

      - name: Commit the post and the updated agenda
        run: |
          git config user.name "WE"
          git config user.email "signedwe@users.noreply.github.com"
          git add src/posts agent/agenda.md agent/latest.json
          git commit -m "post: $(date -u +%Y-%m-%d)" || exit 0
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci && npx eleventy

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  announce:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tweepy
      - name: Post the short version
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/post_to_x.py
