name: WE publishes

# Daily at 09:23 UTC. A schedule, not a promise: change it, pause it, or
# drop it whenever there's a reason to. The odd minute is deliberate: every
# scheduled job on GitHub asks for the top of the hour, that queue is the
# most contended slot there is, and runs asked for at :00 arrive an hour
# late or not at all. The first daily run, set for 09:00, never fired.
# Run times are UTC so
# commit timestamps say nothing about where anyone is.
# A push rebuilds and redeploys the site without writing anything. Only
# the schedule and a manual run make WE write a post.
on:
  push:
    branches: [main]
  schedule:
    # Once an hour through the working day, because GitHub's scheduler runs
    # these hours late or not at all: on 23 September the 09:23 and 11:11
    # firings never came and the day's posts went out between 14:16 and
    # 19:08; on 24 September nothing had fired by 13:43. The agent stands
    # down once the day's forms exist, so a spare firing costs a minute of
    # runner time and writes nothing. Odd minutes, never the top of the hour.
    - cron: "23 8 * * *"
    - cron: "23 9 * * *"
    - cron: "11 10 * * *"
    - cron: "11 11 * * *"
    - cron: "41 12 * * *"
    - cron: "41 13 * * *"
    - cron: "31 14 * * *"
    - cron: "31 15 * * *"
    - cron: "51 16 * * *"
    - cron: "51 17 * * *"
    - cron: "17 19 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    # True when the defamation gate stopped the post. Nothing was written,
    # so nothing may be committed, deployed as new, or announced.
    outputs:
      held: ${{ steps.write_post.outputs.held }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: WE writes today's post
        id: write_post
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent/agent.py

      - name: A held draft arrives by email, as an issue, with the reasons
        if: github.event_name != 'push' && steps.write_post.outputs.held == 'true' && hashFiles('agent/held/*') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in agent/held/*; do
            head -c 60000 "$f" > /tmp/issue-body.md
            gh issue create --title "Held, not published: $(basename "$f")" --body-file /tmp/issue-body.md
          done

      - name: Commit the post and the updated agenda
        if: github.event_name != 'push'
        run: |
          git config user.name "WE"
          git config user.email "signedwe@users.noreply.github.com"
          git add src/posts agent
          git commit -m "post: $(date -u +%Y-%m-%d)" || exit 0
          # Something else may have pushed while WE was writing (the 14:14 run
          # on 24 September lost its post that way). Rebase on it, then push.
          git pull --rebase origin main || exit 1
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci && npx eleventy
      - run: pip install pillow && python scripts/cards.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Tell Bing, DuckDuckGo and Yandex what changed (IndexNow)
        run: python scripts/indexnow.py

  announce:
    needs: [deploy, write]
    permissions:
      contents: read
      issues: write
    # Nothing new was written on a push-triggered build, so there is
    # nothing to announce. Without this, every push re-posts the last
    # post to X. Same for a held post: latest.json still holds the
    # previous one, and announcing it again would look like a new post.
    if: github.event_name != 'push' && needs.write.outputs.held != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tweepy
      - name: Post the short version
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/post_to_x.py

      - name: Open an issue with the tweet, so it arrives by email
        if: hashFiles('agent/to_post.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Tweet: $(date -u '+%-d %B')" \
            --body-file agent/to_post.md
