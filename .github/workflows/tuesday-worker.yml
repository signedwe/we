name: tuesday-worker

# Deploys the Your Tuesday in 2030 reading server to Cloudflare whenever its
# code changes. Needs two repository secrets: CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. The Anthropic key lives in Cloudflare, not here.
on:
  push:
    branches: [main]
    paths: ["tuesday/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes wrangler@3.114.0 deploy --keep-vars
        working-directory: tuesday
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
